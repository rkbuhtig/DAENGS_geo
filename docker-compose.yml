services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: daengs
      POSTGRES_PASSWORD: daengs
      POSTGRES_DB: daengs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
