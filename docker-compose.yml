services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: daengs
      POSTGRES_PASSWORD: daengs
      POSTGRES_DB: daengs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
  api:
    build: .
    env_file: .env
    environment:
      # .env 의 localhost 를 컨테이너 네트워크용으로 덮는다 (environment > env_file)
      DAENGS_DATABASE_URL: postgresql+asyncpg://daengs:daengs@db:5432/daengs
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
