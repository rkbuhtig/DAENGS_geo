<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연속 원 × Hex — 지도 비교</title>
<style>
  :root {
    --ink:#17211e; --muted:#66736f; --line:#d7dfdc; --paper:rgba(250,252,251,.96);
    --continuous:#087b68; --continuous-soft:#e0f2ed; --hex:#bd5c2d; --hex-soft:#f7e9df;
    --danger:#a33c24; --shadow:0 9px 30px rgba(20,35,30,.17);
  }
  * { box-sizing:border-box; }
  html, body, #map { width:100%; height:100%; margin:0; }
  body { color:var(--ink); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; }
  #map { background:#e8eeeb; }
  .panel { position:absolute; z-index:1100; top:14px; left:14px; width:min(420px,calc(100% - 28px));
           padding:15px 16px; border:1px solid var(--line); border-radius:14px; background:var(--paper);
           box-shadow:var(--shadow); backdrop-filter:blur(9px); }
  h1 { margin:0; font-size:18px; letter-spacing:-.025em; }
  .subtitle { margin:5px 0 12px; color:var(--muted); font-size:12px; line-height:1.5; }
  .group { margin-top:10px; }
  .group-title { display:flex; justify-content:space-between; gap:10px; margin-bottom:5px;
                 color:var(--muted); font-size:10px; font-weight:750; letter-spacing:.05em; text-transform:uppercase; }
  .buttons { display:flex; flex-wrap:wrap; gap:5px; }
  button { min-height:31px; padding:5px 9px; border:1px solid var(--line); border-radius:8px;
           background:#fff; color:var(--ink); font:inherit; font-size:11px; cursor:pointer; }
  button:hover { border-color:var(--continuous); }
  button[aria-pressed="true"] { border-color:var(--continuous); background:var(--continuous-soft);
                                color:var(--continuous); font-weight:750; }
  #radius-buttons button[aria-pressed="true"], #hex-debug[aria-pressed="true"] {
    border-color:var(--hex); background:var(--hex-soft); color:var(--hex);
  }
  button:disabled { opacity:.36; cursor:not-allowed; }
  button:focus-visible { outline:3px solid rgba(8,123,104,.28); outline-offset:1px; }
  .receipt { display:grid; grid-template-columns:auto 1fr; gap:4px 10px; margin:12px 0 0;
             padding-top:10px; border-top:1px solid var(--line); font-size:11px; }
  .receipt dt { color:var(--muted); }
  .receipt dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .legend { display:flex; align-items:center; gap:7px; margin-top:10px; color:var(--muted); font-size:10px; }
  .ramp { flex:1; height:8px; border-radius:5px;
          background:linear-gradient(90deg,rgba(8,123,104,.04),rgba(8,123,104,.74)); }
  .layer-key { display:flex; gap:12px; margin-top:8px; color:var(--muted); font-size:10px; }
  .swatch { display:inline-block; width:9px; height:9px; margin-right:4px; border-radius:50%; }
  .detail { position:absolute; z-index:1100; left:14px; bottom:16px; width:min(420px,calc(100% - 28px));
            padding:11px 14px; border:1px solid var(--line); border-radius:11px; background:var(--paper);
            box-shadow:var(--shadow); font-size:11px; }
  .detail-grid { display:grid; grid-template-columns:1fr auto; gap:4px 12px; }
  .detail-grid span:nth-child(odd) { color:var(--muted); }
  .detail-grid strong, .detail-grid span:nth-child(even) { text-align:right; font-variant-numeric:tabular-nums; }
  #banner { position:absolute; z-index:1200; top:14px; right:14px; max-width:430px; padding:9px 12px;
            border-radius:8px; background:var(--danger); color:#fff; font-size:12px; display:none; }
  .home-marker { width:18px; height:18px; border:3px solid #fff; border-radius:50%; background:#a33c24;
                 box-shadow:0 1px 5px rgba(0,0,0,.35); }
  [hidden] { display:none !important; }
  @media (max-width:680px) {
    .panel { top:8px; left:8px; width:calc(100% - 16px); padding:11px; }
    .detail { left:8px; bottom:8px; width:calc(100% - 16px); }
    .subtitle, .receipt { display:none; }
    button { min-height:39px; }
  }
</style>
</head>
<body>
<div id="map" aria-label="연속 원과 Hex 비교 지도"></div>
<div id="banner" role="alert"></div>

<section class="panel" aria-label="비교 설정">
  <h1>같은 산책, 두 개의 공간 투영</h1>
  <p class="subtitle">청록은 4m 측정 raster로 읽은 연속 원 field, 주황은 같은 canonical Segment를 칠한 Hex다. 한 번에 같은 metric만 비교한다.</p>

  <div class="group">
    <div class="group-title"><span>보기</span><span id="mode-label">—</span></div>
    <div class="buttons" id="mode-buttons">
      <button type="button" data-mode="continuous" aria-pressed="true">연속 원</button>
      <button type="button" data-mode="hex" aria-pressed="false">Hex</button>
      <button type="button" data-mode="overlay" aria-pressed="false">겹쳐보기</button>
    </div>
  </div>
  <div class="group">
    <div class="group-title"><span>metric</span><span id="metric-unit">—</span></div>
    <div class="buttons" id="metric-buttons"></div>
  </div>
  <div class="group">
    <div class="group-title"><span>Hex 해상도</span><span id="ground-radius">—</span></div>
    <div class="buttons" id="radius-buttons"></div>
  </div>
  <div class="group">
    <div class="group-title"><span>검산</span><span id="region-summary">—</span></div>
    <div class="buttons" id="region-buttons">
      <button type="button" data-region="none" aria-pressed="true">영역 끄기</button>
      <button type="button" data-region="0.5" aria-pressed="false">50%</button>
      <button type="button" data-region="0.8" aria-pressed="false">80%</button>
      <button type="button" data-region="0.95" aria-pressed="false">95%</button>
      <button type="button" id="hex-debug" aria-pressed="false">육각 경계</button>
    </div>
  </div>

  <dl class="receipt">
    <dt>표본</dt><dd id="r-population">—</dd>
    <dt>질량</dt><dd id="r-mass">—</dd>
    <dt>Support</dt><dd id="r-support">—</dd>
    <dt>공간 차이</dt><dd id="r-distance">—</dd>
    <dt>표현</dt><dd>값/최댓값 제곱근 · 연속 raster bilinear</dd>
  </dl>
  <div class="legend"><span>0</span><div class="ramp" id="legend-ramp"></div><span id="legend-max">—</span></div>
  <div class="layer-key"><span><i class="swatch" style="background:var(--continuous)"></i>연속 원</span><span><i class="swatch" style="background:var(--hex)"></i>Hex</span></div>
</section>

<section class="detail" aria-live="polite">
  <div id="detail-empty">지도를 누르면 같은 위치의 연속 pixel과 Hex 값을 함께 본다.</div>
  <div class="detail-grid" id="detail-value" hidden>
    <span>위치</span><strong id="d-location">—</strong>
    <span>연속 원</span><strong id="d-continuous">—</strong>
    <span>Hex</span><strong id="d-hex">—</strong>
    <span>면적 단위 차이</span><strong id="d-difference">—</strong>
  </div>
</section>

<script>
'use strict';
const DATA_URL = '/continuous-hex-comparison/data';
const METRIC_ORDER = ['visit_rate','total_time','conditional_dwell','time_utilization','walk_utilization'];
const DISTRIBUTION_METRICS = new Set(['time_utilization','walk_utilization']);
const UNIT_LABELS = {ratio:'비율',s:'초','s/visited_walk':'초/방문 산책',share:'비중'};
const MODE_LABELS = {continuous:'연속 원 field',hex:'Hex Cellophane',overlay:'청록 + 주황 겹침'};
const EARTH_R = 6378137;
const state = {
  payload:null, config:null, provider:null, backend:null, metric:'time_utilization', mode:'continuous',
  radiusIndex:1, region:'none', hexDebug:false, rasterImages:new Map(), referenceIndex:new Map(),
  hexIndex:new Map(), continuousOverlay:null, hexOverlays:[], outlines:[], homeOverlay:null,
  selectedLatLng:null, switchPromise:null, authWatchTimer:null,
};
let naverAuthFailureHandler = null;
const $ = (id) => document.getElementById(id);

function showError(message) {
  $('banner').textContent = message;
  $('banner').style.display = message ? 'block' : 'none';
}

function loadNaverMaps(keyId) {
  return new Promise((resolve,reject) => {
    const callback = '__continuousHexReady';
    const timeout = setTimeout(() => reject(new Error('NAVER SDK timeout')),8000);
    window[callback] = () => { clearTimeout(timeout); resolve(); };
    window.navermap_authFailure = () => {
      const error = new Error('NAVER 인증 실패');
      clearTimeout(timeout);
      if (naverAuthFailureHandler) naverAuthFailureHandler(error);
      reject(error);
    };
    const script = document.createElement('script');
    script.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(keyId)}&callback=${callback}`;
    script.onerror = () => { clearTimeout(timeout); reject(new Error('NAVER SDK 로드 실패')); };
    document.head.appendChild(script);
  });
}

function loadLeaflet() {
  return new Promise((resolve,reject) => {
    if (window.L) { resolve(); return; }
    const stylesheet = document.createElement('link');
    stylesheet.rel = 'stylesheet';
    stylesheet.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(stylesheet);
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    script.onload = resolve;
    script.onerror = () => reject(new Error('OpenStreetMap viewer 로드 실패'));
    document.head.appendChild(script);
  });
}

function leafletStyle(style) {
  const translated = {};
  if ('fillColor' in style) translated.fillColor = style.fillColor;
  if ('fillOpacity' in style) translated.fillOpacity = style.fillOpacity;
  if ('strokeColor' in style) translated.color = style.strokeColor;
  if ('strokeOpacity' in style) translated.opacity = style.strokeOpacity;
  if ('strokeWeight' in style) translated.weight = style.strokeWeight;
  return translated;
}

function naverBackend(payload) {
  const map = new naver.maps.Map('map',{
    center:new naver.maps.LatLng(...payload.home),zoom:16,scaleControl:true,mapDataControl:true,
  });
  const bounds = ([south,west,north,east]) => new naver.maps.LatLngBounds(
    new naver.maps.LatLng(south,west),new naver.maps.LatLng(north,east)
  );
  const wrap = (overlay) => ({
    setStyle:(style) => overlay.setOptions(style),
    onClick:(choose) => naver.maps.Event.addListener(overlay,'click',choose),
    remove:() => overlay.setMap(null),
  });
  return {
    fit:(bbox) => map.fitBounds(bounds(bbox)),
    onMapClick:(choose) => naver.maps.Event.addListener(map,'click',(event) => choose(event.coord.y,event.coord.x)),
    home:(point) => {
      const marker = new naver.maps.Marker({
        map,position:new naver.maps.LatLng(...point),title:'공통 시작·종료점',
        icon:{content:'<div class="home-marker" aria-label="공통 시작·종료점"></div>',anchor:new naver.maps.Point(9,9)},
      });
      return {remove:() => marker.setMap(null)};
    },
    image:(url,bbox,opacity) => {
      const overlay = new naver.maps.GroundOverlay(url,bounds(bbox),{map,opacity,clickable:false});
      return {remove:() => overlay.setMap(null)};
    },
    polygon:(boundary,style) => wrap(new naver.maps.Polygon({
      map,paths:[boundary.map(([lat,lng]) => new naver.maps.LatLng(lat,lng))],
      ...style,clickable:true,
    })),
    polyline:(edge,style) => wrap(new naver.maps.Polyline({
      map,path:edge.map(([lat,lng]) => new naver.maps.LatLng(lat,lng)),...style,clickable:false,
    })),
  };
}

function leafletBackend(payload) {
  const map = L.map('map',{zoomControl:false}).setView(payload.home,16);
  L.control.zoom({position:'topright'}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,attribution:'© OpenStreetMap contributors',
  }).addTo(map);
  const wrap = (overlay) => ({
    setStyle:(style) => overlay.setStyle(leafletStyle(style)),
    onClick:(choose) => overlay.on('click',choose),remove:() => overlay.remove(),
  });
  return {
    fit:([south,west,north,east]) => map.fitBounds([[south,west],[north,east]],{padding:[18,18]}),
    onMapClick:(choose) => map.on('click',(event) => choose(event.latlng.lat,event.latlng.lng)),
    home:(point) => {
      const marker = L.circleMarker(point,{radius:7,fillColor:'#a33c24',fillOpacity:1,color:'#fff',weight:3})
        .bindTooltip('공통 시작·종료점').addTo(map);
      return {remove:() => marker.remove()};
    },
    image:(url,[south,west,north,east],opacity) => {
      const overlay = L.imageOverlay(url,[[south,west],[north,east]],{opacity,interactive:false}).addTo(map);
      return {remove:() => overlay.remove()};
    },
    polygon:(boundary,style) => wrap(L.polygon(boundary,leafletStyle(style)).addTo(map)),
    polyline:(edge,style) => wrap(L.polyline(edge,leafletStyle(style)).addTo(map)),
  };
}

function currentRadius() { return state.payload.radii[state.radiusIndex]; }
function currentReferenceMetric() { return state.payload.reference.metrics[state.metric]; }
function currentHexMetric() { return currentRadius().metrics[state.metric]; }

function formatValue(value,unit) {
  if (unit === 'ratio' || unit === 'share') return `${(value * 100).toFixed(value < .01 ? 2 : 1)}%`;
  if (unit === 's') return `${value.toFixed(1)}초`;
  if (unit === 's/visited_walk') return `${value.toFixed(1)}초/방문`;
  return String(value);
}

function buildRasterImage(metric) {
  if (state.rasterImages.has(metric)) return state.rasterImages.get(metric);
  const reference = state.payload.reference;
  const {width,height,min_x,max_y} = reference.bounds;
  const base = document.createElement('canvas');
  base.width = width; base.height = height;
  const context = base.getContext('2d');
  const image = context.createImageData(width,height);
  const maximum = Math.max(reference.metrics[metric].max_value,1e-12);
  reference.pixels.forEach((pixel) => {
    const x = pixel.x - min_x;
    const y = max_y - pixel.y;
    const ratio = Math.max(0,pixel.values[metric] / maximum);
    const offset = (y * width + x) * 4;
    image.data[offset] = 8; image.data[offset + 1] = 123; image.data[offset + 2] = 104;
    image.data[offset + 3] = ratio > 0 ? Math.round((.035 + Math.sqrt(ratio) * .72) * 255) : 0;
  });
  context.putImageData(image,0,0);
  const smooth = document.createElement('canvas');
  smooth.width = width * 4; smooth.height = height * 4;
  const smoothContext = smooth.getContext('2d');
  smoothContext.imageSmoothingEnabled = true;
  smoothContext.imageSmoothingQuality = 'high';
  smoothContext.drawImage(base,0,0,smooth.width,smooth.height);
  const url = smooth.toDataURL('image/png');
  state.rasterImages.set(metric,url);
  return url;
}

function clearLayers() {
  if (state.continuousOverlay) state.continuousOverlay.remove();
  state.continuousOverlay = null;
  state.hexOverlays.forEach((item) => item.overlay.remove());
  state.hexOverlays = [];
  state.outlines.forEach((overlay) => overlay.remove());
  state.outlines = [];
  state.hexIndex.clear();
}

function drawHex() {
  const radius = currentRadius();
  const maximum = Math.max(currentHexMetric().max_value,1e-12);
  state.hexOverlays = radius.cells.map((cell) => {
    const ratio = Math.max(0,cell.values[state.metric] / maximum);
    const overlay = state.backend.polygon(cell.boundary,{
      fillColor:'#bd5c2d',fillOpacity:.035 + Math.sqrt(ratio) * (state.mode === 'overlay' ? .38 : .67),
      strokeColor:'#6d2f16',strokeOpacity:state.hexDebug ? .5 : 0,strokeWeight:state.hexDebug ? 1 : 0,
    });
    overlay.onClick(() => selectAt(
      cell.boundary.reduce((sum,point) => sum + point[0],0) / cell.boundary.length,
      cell.boundary.reduce((sum,point) => sum + point[1],0) / cell.boundary.length
    ));
    state.hexIndex.set(`${cell.q}:${cell.r}`,cell);
    return {cell,overlay};
  });
}

function selectedRegion(layer) {
  if (state.region === 'none' || !DISTRIBUTION_METRICS.has(state.metric)) return null;
  const source = layer === 'reference' ? state.payload.reference : currentRadius();
  return source.regions[state.metric].find((item) => item.target_mass === Number(state.region));
}

function drawRegions() {
  if (state.region === 'none' || !DISTRIBUTION_METRICS.has(state.metric)) return;
  const draw = (region,color,weight) => region.boundary_edges.forEach((edge) => {
    state.outlines.push(state.backend.polyline(edge,{
      strokeColor:color,strokeOpacity:.96,strokeWeight:weight,fillOpacity:0,
    }));
  });
  if (state.mode !== 'hex') draw(selectedRegion('reference'),'#087b68',4);
  if (state.mode !== 'continuous') draw(selectedRegion('hex'),'#bd5c2d',state.mode === 'overlay' ? 3 : 4);
}

function renderLayers() {
  clearLayers();
  if (state.mode !== 'hex') {
    state.continuousOverlay = state.backend.image(
      buildRasterImage(state.metric),state.payload.reference.bbox,state.mode === 'overlay' ? .68 : .94
    );
  }
  if (state.mode !== 'continuous') drawHex();
  drawRegions();
  updateReceipt();
  if (state.selectedLatLng) selectAt(...state.selectedLatLng);
}

function mercator(lat,lng) {
  const safeLat = Math.max(-85,Math.min(85,lat));
  return [EARTH_R * lng * Math.PI / 180,
    EARTH_R * Math.log(Math.tan(Math.PI / 4 + safeLat * Math.PI / 360))];
}

function referencePixelAt(lat,lng) {
  const reference = state.payload.reference;
  const [x,y] = mercator(lat,lng);
  const [originX,originY] = mercator(...reference.origin);
  const scale = Math.cos(reference.origin[0] * Math.PI / 180);
  const pixelX = Math.floor((x - originX) * scale / reference.pixel_m);
  const pixelY = Math.floor((y - originY) * scale / reference.pixel_m);
  return state.referenceIndex.get(`${pixelX}:${pixelY}`) || null;
}

function roundAxial(q,r) {
  const x = q, z = r, y = -x-z;
  let rx = Math.round(x), ry = Math.round(y), rz = Math.round(z);
  const dx = Math.abs(rx-x), dy = Math.abs(ry-y), dz = Math.abs(rz-z);
  if (dx > dy && dx > dz) rx = -ry-rz;
  else if (dy > dz) ry = -rx-rz;
  else rz = -rx-ry;
  return [rx,rz];
}

function hexAt(lat,lng,radiusU) {
  const [x,y] = mercator(lat,lng);
  return roundAxial((Math.sqrt(3)/3*x-y/3)/radiusU,(2/3*y)/radiusU);
}

function density(value,area) { return value / area; }

function selectAt(lat,lng) {
  state.selectedLatLng = [lat,lng];
  const reference = referencePixelAt(lat,lng);
  const [q,r] = hexAt(lat,lng,currentRadius().radius_u);
  const cell = state.hexIndex.get(`${q}:${r}`) || currentRadius().cells.find((row) => row.q === q && row.r === r) || null;
  const refValue = reference ? reference.values[state.metric] : 0;
  const hexValue = cell ? cell.values[state.metric] : 0;
  const unit = currentReferenceMetric().unit;
  let difference;
  if (state.metric === 'visit_rate') difference = `${((refValue-hexValue)*100).toFixed(2)}%p`;
  else {
    const delta = density(refValue,state.payload.reference.pixel_m ** 2) -
      density(hexValue,currentRadius().cell_area_m2_at_origin);
    difference = `${delta.toExponential(3)} ${unit}/m²`;
  }
  $('detail-empty').hidden = true;
  $('detail-value').hidden = false;
  $('d-location').textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  $('d-continuous').textContent = formatValue(refValue,unit);
  $('d-hex').textContent = `${formatValue(hexValue,unit)} · (${q},${r})`;
  $('d-difference').textContent = difference;
}

function updateReceipt() {
  const radius = currentRadius();
  const metric = radius.comparison.metrics[state.metric];
  const unit = currentReferenceMetric().unit;
  $('mode-label').textContent = MODE_LABELS[state.mode];
  $('metric-unit').textContent = UNIT_LABELS[unit] || unit;
  $('ground-radius').textContent = `${radius.radius_u}u = ${radius.ground_radius_m_at_origin.toFixed(2)}m`;
  $('r-population').textContent = `${state.payload.population.sample_count}장 · v${state.payload.population.generator_version} · ${state.payload.population.run_id}`;
  $('r-mass').textContent = `오차 ${radius.comparison.mass.absolute_error_s.toExponential(2)}초`;
  $('r-support').textContent = `IoU ${(radius.comparison.support.sampled_area_iou*100).toFixed(1)}% · 면적비 ${radius.comparison.support.area_ratio_hex_over_reference.toFixed(3)}`;
  $('r-distance').textContent = state.metric === 'visit_rate'
    ? `MAE ${(metric.mean_absolute_error*100).toFixed(2)}%p`
    : `normalized L1 ${metric.normalized_l1.toFixed(3)}`;
  $('legend-max').textContent = formatValue(currentReferenceMetric().max_value,unit);
  $('legend-ramp').style.background = state.mode === 'hex'
    ? 'linear-gradient(90deg,rgba(189,92,45,.04),rgba(189,92,45,.74))'
    : state.mode === 'overlay'
      ? 'linear-gradient(90deg,#087b68,#bd5c2d)'
      : 'linear-gradient(90deg,rgba(8,123,104,.04),rgba(8,123,104,.74))';
  const refRegion = selectedRegion('reference');
  const hexRegion = selectedRegion('hex');
  if (!refRegion || !hexRegion) $('region-summary').textContent = DISTRIBUTION_METRICS.has(state.metric) ? '선택 가능' : '이용분포 전용';
  else {
    const comparison = radius.comparison.mass_regions[state.metric]
      .find((row) => row.target_mass === Number(state.region));
    $('region-summary').textContent = `영역 IoU ${(comparison.area_iou*100).toFixed(1)}%`;
  }
}

function setPressed(container,attribute,value) {
  document.querySelectorAll(`#${container} button[data-${attribute}]`).forEach((button) => {
    button.setAttribute('aria-pressed',String(button.dataset[attribute] === String(value)));
  });
}

function chooseMode(mode) {
  state.mode = mode; setPressed('mode-buttons','mode',mode); renderLayers();
}

function chooseMetric(metric) {
  state.metric = metric;
  if (!DISTRIBUTION_METRICS.has(metric)) state.region = 'none';
  setPressed('metric-buttons','metric',metric);
  setPressed('region-buttons','region',state.region);
  document.querySelectorAll('#region-buttons button[data-region]').forEach((button) => {
    button.disabled = !DISTRIBUTION_METRICS.has(metric) && button.dataset.region !== 'none';
  });
  renderLayers();
}

function chooseRadius(index) {
  state.radiusIndex = Number(index); setPressed('radius-buttons','radius',index); renderLayers();
}

function chooseRegion(region) {
  state.region = region; setPressed('region-buttons','region',region); renderLayers();
}

function buildControls() {
  if ($('metric-buttons').childElementCount) return;
  METRIC_ORDER.forEach((metric) => {
    const button = document.createElement('button');
    button.type = 'button'; button.dataset.metric = metric;
    button.textContent = state.payload.reference.metrics[metric].label;
    button.setAttribute('aria-pressed',String(metric === state.metric));
    button.addEventListener('click',() => chooseMetric(metric));
    $('metric-buttons').appendChild(button);
  });
  state.payload.radii.forEach((radius,index) => {
    const button = document.createElement('button');
    button.type = 'button'; button.dataset.radius = String(index); button.textContent = `${radius.radius_u}u`;
    button.setAttribute('aria-pressed',String(index === state.radiusIndex));
    button.addEventListener('click',() => chooseRadius(index));
    $('radius-buttons').appendChild(button);
  });
  document.querySelectorAll('#mode-buttons button').forEach((button) => {
    button.addEventListener('click',() => chooseMode(button.dataset.mode));
  });
  document.querySelectorAll('#region-buttons button[data-region]').forEach((button) => {
    button.addEventListener('click',() => chooseRegion(button.dataset.region));
  });
  $('hex-debug').addEventListener('click',() => {
    state.hexDebug = !state.hexDebug;
    $('hex-debug').setAttribute('aria-pressed',String(state.hexDebug));
    renderLayers();
  });
}

function drawMap() {
  state.backend.fit(state.payload.bbox);
  state.homeOverlay = state.backend.home(state.payload.home);
  state.backend.onMapClick((lat,lng) => selectAt(lat,lng));
  state.referenceIndex = new Map(state.payload.reference.pixels.map((pixel) => [`${pixel.x}:${pixel.y}`,pixel]));
  buildControls();
  chooseMetric(state.metric);
}

function clearMapPresentation() {
  const brokenNaver = state.provider === 'naver';
  if (!brokenNaver) clearLayers();
  else { state.continuousOverlay = null; state.hexOverlays = []; state.outlines = []; }
  if (state.homeOverlay && !brokenNaver) state.homeOverlay.remove();
  state.homeOverlay = null; state.provider = null; state.backend = null;
  $('map').replaceChildren();
}

async function useOsmFallback(cause) {
  if (state.provider === 'osm') return;
  if (state.switchPromise) return state.switchPromise;
  const switching = (async () => {
    clearMapPresentation();
    if (state.authWatchTimer) clearInterval(state.authWatchTimer);
    state.authWatchTimer = null;
    if (state.config.fallback !== 'osm') throw cause;
    await loadLeaflet();
    state.backend = leafletBackend(state.payload); state.provider = 'osm'; drawMap(); showError('');
  })();
  state.switchPromise = switching;
  try { await switching; }
  finally { if (state.switchPromise === switching) state.switchPromise = null; }
}

function watchNaverAuthFailure() {
  if (state.authWatchTimer) clearInterval(state.authWatchTimer);
  state.authWatchTimer = setInterval(() => {
    if ($('map').textContent.includes('인증이 실패')) {
      const error = new Error('NAVER 인증 실패');
      if (naverAuthFailureHandler) naverAuthFailureHandler(error);
    }
  },250);
}

async function main() {
  try {
    const [configResponse,dataResponse] = await Promise.all([
      fetch('/map/client-config'),fetch(DATA_URL,{cache:'no-store'}),
    ]);
    if (!configResponse.ok || !dataResponse.ok) throw new Error('지도 설정 또는 fixture를 읽지 못했습니다');
    state.config = await configResponse.json();
    state.payload = await dataResponse.json();
    if (state.payload.format_version !== 1 || state.payload.coordinate_order !== 'lat,lng') {
      throw new Error('지원하지 않는 비교 payload입니다');
    }
    if (!state.payload.reference || !Number.isFinite(state.payload.reference.pixel_m) ||
        !Array.isArray(state.payload.radii) || state.payload.radii.length === 0 ||
        state.payload.radii.some((radius) => !Number.isFinite(radius.cell_area_m2_at_origin))) {
      throw new Error('면적 단위가 없는 비교 payload입니다');
    }
    naverAuthFailureHandler = (error) => {
      void useOsmFallback(error).catch((fallbackError) => showError(fallbackError.message || String(fallbackError)));
    };
    if (state.config.provider === 'naver' && state.config.naver_key_id) {
      try {
        watchNaverAuthFailure(); await loadNaverMaps(state.config.naver_key_id);
        if (state.switchPromise) await state.switchPromise;
        if (!state.backend) {
          state.provider = 'naver'; state.backend = naverBackend(state.payload); drawMap();
        }
      } catch (error) { await useOsmFallback(error); }
    }
    if (!state.backend) await useOsmFallback(new Error('사용 가능한 실제 지도 제공사가 없습니다'));
    showError('');
  } catch (error) {
    console.error(error);
    showError(`${error.message || error}. 먼저 continuous-hex-visualization.json을 생성하세요.`);
  }
}
main();
</script>
</body>
</html>
