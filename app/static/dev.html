<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DAENGS_geo dev console</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font: 13px/1.4 system-ui, sans-serif; display:grid; grid-template-columns: 420px 1fr; height:100vh; color:#222; }
  #left { overflow:auto; border-right:1px solid #ddd; padding:10px; }
  #map { height:100vh; }
  h3 { margin:10px 0 4px; font-size:12px; color:#666; text-transform:uppercase; letter-spacing:.04em; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:4px 0; }
  .chip { border:1px solid #bbb; border-radius:14px; padding:2px 9px; cursor:pointer; background:#fff; font-size:12px; }
  .chip.on { background:#222; color:#fff; border-color:#222; }
  input[type=text] { width:100%; padding:6px 8px; border:1px solid #bbb; border-radius:6px; }
  select, button { padding:4px 8px; }
  .card { border:1px solid #ddd; border-radius:8px; padding:8px; margin:6px 0; cursor:pointer; }
  .card.sel { border-color:#222; box-shadow:0 0 0 2px #2223; }
  .card .name { font-weight:600; }
  .muted { color:#777; }
  .adv-ok { color:#1a7f37; } .adv-caution { color:#b26a00; } .adv-avoid { color:#c62828; font-weight:600; }
  .changes { background:#f6f6f6; border-radius:6px; padding:6px 8px; margin:6px 0; white-space:pre-wrap; }
  .q { background:#fff4d6; border-radius:6px; padding:6px 8px; margin:6px 0; }
  .spot { display:flex; gap:6px; padding:3px 0; border-top:1px dashed #eee; }
  .spot .n { width:18px; height:18px; border-radius:50%; background:#444; color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; flex:none; }
  .spot.warn .n { background:#c62828; }
  .ev { font-size:12px; color:#555; margin-top:2px; }
  .tag { font-size:11px; background:#eee; border-radius:4px; padding:0 4px; margin-right:3px; }
  .hand a { margin-right:8px; font-size:12px; }
  .pol { font-size:10px; border-radius:8px; padding:1px 6px; margin-left:4px; text-transform:none; letter-spacing:0; font-weight:400; }
  .pol.t { background:#e3f2fd; color:#1565c0; } .pol.j { background:#e8f5e9; color:#2e7d32; }
  .chg { display:flex; gap:6px; align-items:baseline; margin:2px 0; }
</style>
</head>
<body>
<div id="left">
  <h3>페르소나 · 출발지 (지도 클릭)</h3>
  <div class="row">
    <select id="dog"><option value="halmae">할매 (말티즈 13세·관절)</option><option value="dubu">두부 (퍼그 5세·과체중)</option><option value="kong">콩이 (보더콜리 2세)</option><option value="">없음</option></select>
    <span id="origin" class="muted">37.4979, 127.0276</span>
    <button id="reset">초안</button>
  </div>

  <h3>어디를 갈까 <span class="pol t">target · 결과가 바뀜</span></h3>
  <div class="row">
    <span class="chip" data-tool="set_time" data-args='{"open_now":true}' data-off='{"open_now":false}' data-key="open_now">지금 영업중</span>
    <span class="chip" data-tool="set_time" data-args='{"night":true}' data-off='{"night":false}' data-key="night">야간</span>
    <span class="chip" data-tool="set_time" data-args='{"emergency":true}' data-off='{"emergency":false}' data-key="emergency">응급</span>
    <span class="chip" data-tool="require" data-args='{"tags":["24h"]}' data-off-tool="unrequire" data-off='{"tags":["24h"]}' data-key="req=24h">24시</span>
    <span class="chip" data-tool="require" data-args='{"tags":["center"]}' data-off-tool="unrequire" data-off='{"tags":["center"]}' data-key="req=center">의료센터</span>
  </div>
  <div class="row">반경 <input type="range" id="radius" min="300" max="5000" step="100" value="2000" style="flex:1"><span id="radiusv">2km</span></div>

  <h3>어떻게 갈까 <span class="pol j">journey · 결과는 그대로</span></h3>
  <div class="row">
    <span class="chip" data-tool="set_mode" data-args='{"mode":"walk"}' data-off='{"mode":null}' data-key="mode=walk">도보</span>
    <span class="chip" data-tool="set_mode" data-args='{"mode":"car"}' data-off='{"mode":null}' data-key="mode=car">차량</span>
    <span class="chip" data-tool="set_walk_option" data-args='{"option":"no_stairs"}' data-off='{"option":"recommended"}' data-key="walk.option=no_stairs">계단제외</span>
    <span class="chip" data-tool="avoid" data-args='{"facilities":["underpass"]}' data-off-tool="unavoid" data-off='{"facilities":["underpass"]}' data-key="avoid=underpass">지하도 피함</span>
  </div>
  <div class="row">
    <span>시간 상한</span>
    <input type="number" id="maxmin" min="0" step="5" placeholder="분" style="width:70px">
    <label><input type="checkbox" id="hard"> 초과 제외 <span class="muted">(끄면 표시만)</span></label>
    <button id="applymax">적용</button>
  </div>

  <h3>자연어 (utterance)</h3>
  <input type="text" id="utt" placeholder="예: 눈이 뿌옇고 걸어서 갈 수 있는 데 / 첫번째 거는 빼줘 / 아까대로">
  <div class="row"><button id="send">보내기</button><span class="muted">Enter로도 전송</span></div>

  <div id="changes" class="changes"></div>
  <div id="question" class="q" style="display:none"></div>

  <h3>결과 <span id="count" class="muted"></span></h3>
  <div id="list"></div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = "/hospital/search";
let state = null, shown = [], selected = null, origin = [37.4979, 127.0276];
const map = L.map('map').setView(origin, 15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap (dev only)'}).addTo(map);
const layer = L.layerGroup().addTo(map);
let originMarker = L.circleMarker(origin, {radius: 8, color: '#1565c0', fillOpacity: .9}).addTo(map).bindTooltip('출발');
map.on('click', e => { origin = [e.latlng.lat, e.latlng.lng]; originMarker.setLatLng(origin); document.getElementById('origin').textContent = origin.map(v => v.toFixed(4)).join(', '); run({reset: true}); });

const $ = id => document.getElementById(id);
function decodePolyline(str, precision = 5) {
  const f = 10 ** precision; let i = 0, lat = 0, lng = 0; const pts = [];
  while (i < str.length) {
    for (const which of [0, 1]) {
      let shift = 0, result = 0, b;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = (result & 1) ? ~(result >> 1) : (result >> 1);
      if (which === 0) lat += d; else lng += d;
    }
    pts.push([lat / f, lng / f]);
  }
  return pts;
}
const COLORS = ['#1565c0', '#2e7d32', '#6a1b9a', '#ef6c00', '#00838f', '#5d4037'];
$('radius').oninput = e => $('radiusv').textContent = (e.target.value / 1000) + 'km';
$('radius').onchange = e => run({edits: [{tool: 'set_radius', args: {m: +e.target.value}}]});
$('applymax').onclick = () => { const v = $('maxmin').value; run({edits: [{tool: 'set_max_min', args: {minutes: v === '' ? null : +v, hard: $('hard').checked}}]}); };
$('reset').onclick = () => run({reset: true});
$('dog').onchange = () => run({reset: true});
$('send').onclick = () => { const u = $('utt').value.trim(); if (u) run({utterance: u}); };
$('utt').onkeydown = e => { if (e.key === 'Enter') $('send').click(); };
document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  const on = c.classList.contains('on');
  const args = JSON.parse(on ? (c.dataset.off || 'null') : c.dataset.args);
  if (args === null) return;
  const tool = on ? (c.dataset.offTool || c.dataset.tool) : c.dataset.tool;
  run({edits: [{tool, args}]});
});

async function run({reset = false, edits = [], utterance = null} = {}) {
  const body = {dog_id: $('dog').value || null, origin, edits, utterance, shown_ids: shown};
  if (!reset && state) body.state = state;
  const r = await fetch(API, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const d = await r.json();
  if (!r.ok) { $('changes').textContent = JSON.stringify(d, null, 1); return; }
  state = d.state; shown = d.results.map(x => x.id);
  $('utt').value = '';
  render(d);
}

function syncChips(st) {
  const tg = st.target, jn = st.journey;
  document.querySelectorAll('.chip').forEach(c => {
    const k = c.dataset.key; let on = false;
    if (k === 'open_now') on = tg.open_now; else if (k === 'night') on = tg.night; else if (k === 'emergency') on = tg.emergency;
    else if (k.startsWith('req=')) on = (tg.require_tags || []).includes(k.split('=')[1]);
    else if (k.startsWith('mode=')) on = jn.mode === k.split('=')[1];
    else if (k === 'walk.option=no_stairs') on = jn.walk.option === 'no_stairs';
    else if (k === 'avoid=underpass') on = (jn.walk.avoid || []).includes('underpass');
    c.classList.toggle('on', !!on);
  });
  $('radius').value = tg.radius_m; $('radiusv').textContent = (tg.radius_m / 1000) + 'km';
  $('maxmin').value = jn.max_min == null ? '' : jn.max_min; $('hard').checked = !!jn.hard_limit;
}

function render(d) {
  syncChips(d.state);
  const g = d.changes_by_policy || {};
  const line = (cls, label, arr) => (arr && arr.length) ? `<div class="chg"><span class="pol ${cls}">${label}</span><span>${arr.join(' · ')}</span></div>` : '';
  $('changes').innerHTML = (line('t', '찾는 곳', g.target) + line('j', '가는 길', g.journey) + line('t', '보기', g.view)
     || `<div class="chg">${d.changes.join(' · ')}</div>`) + `<div class="muted">${d.reply}</div>`;
  $('question').style.display = d.question ? '' : 'none'; $('question').textContent = d.question || '';
  $('count').textContent = d.results.length + '곳';
  layer.clearLayers();
  const list = $('list'); list.innerHTML = '';
  // 1) 선이 먼저 — 실측된 모든 경로를 옅게. 카드 안 눌러도 "어느 쪽으로 얼마나"가 보인다
  const allBounds = [];
  d.results.forEach((x, i) => {
    const w = (x.transport || {}).walk;
    if (w && w.polyline) {
      const pts = decodePolyline(w.polyline);
      const isSel = x.id === selected;
      L.polyline(pts, {color: COLORS[i % COLORS.length], weight: isSel ? 6 : 3, opacity: isSel ? .95 : (selected ? .25 : .6)}).addTo(layer)
        .bindTooltip(`${String.fromCharCode(65 + i)} ${x.name} · 🚶${w.min}분`);
      if (!selected) allBounds.push(...pts);
    }
  });
  if (!selected && allBounds.length) map.fitBounds(L.latLngBounds(allBounds).pad(0.15));
  d.results.forEach((x, i) => {
    const t = x.transport || {}, w = t.walk || {}, c = t.car || {}, tr = t.transit;
    const label = String.fromCharCode(65 + i);
    L.marker([x.lat, x.lng], {icon: L.divIcon({className: '', html: `<div style="background:${x.id === selected ? '#c62828' : COLORS[i % COLORS.length]};color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">${label}</div>`, iconSize: [22, 22]})}).addTo(layer).bindTooltip(x.name);
    const card = document.createElement('div'); card.className = 'card' + (x.id === selected ? ' sel' : '');
    const fac = w.facilities || {};
    const advCls = 'adv-' + (w.advice || 'ok');
    card.innerHTML = `
      <div><span class="name">${label}. ${x.name}</span> <span class="muted">${x.distance_m}m · ${x.open_now === null ? '영업 미상' : x.open_now ? '영업중' : '영업종료'}</span></div>
      <div>${(x.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}${x.area_m2 ? `<span class="muted">${x.area_m2}㎡ · ${x.staff_count ?? '?'}인</span>` : ''}</div>
      ${t.walk ? `<div>🚶 <b>${w.min}분</b><span class="muted">(제공사 ${w.provider_min ?? w.min}·${w.source})</span> ${w.m}m · 횡단${fac.crosswalk ?? 0} 계단${fac.stairs ?? 0} 지하${fac.underpass ?? 0} <span class="${advCls}">${w.advice}</span> <span class="muted">${(w.why || []).join(' / ')}</span></div>` : ''}
      ${w.alternatives && w.alternatives.length ? `<div class="muted">대안: ${w.alternatives.map(a => `${a.option} ${a.min}분 (Δ${a.delta_min >= 0 ? '+' : ''}${a.delta_min})`).join(', ')}</div>` : ''}
      ${t.car ? `<div>🚗 ${c.min}분 ${c.m}m · 택시 ${c.taxi_fare ?? '-'}원 ${tr ? `· 🚌 ${tr.min}분 ${tr.fare}원` : ''}</div>` : ''}
      ${x.evidence.map(e => `<div class="ev">[${e.source}] ${e.text}</div>`).join('')}
      <div class="spots"></div>`;
    card.onclick = () => { selected = (selected === x.id ? null : x.id); run({}); };
    if (x.id === selected && w.spots) {
      const sp = card.querySelector('.spots');
      sp.innerHTML = '<details open><summary style="cursor:pointer;color:#666;font-size:12px">걸리는 지점 (지도의 점) — 펼치기</summary>' + w.spots.map((s, j) => `<div class="spot ${s.warn ? 'warn' : ''}"><span class="n">${j + 1}</span><div>${s.text}<div class="muted">${s.note || ''}</div></div></div>`).join('')
        + '</details>' + (w.handoff ? `<div class="hand" style="margin-top:6px">따라가기: <a href="${w.handoff.naver}">네이버</a><a href="${w.handoff.kakao}">카카오</a><a href="${w.handoff.tmap}">TMAP</a></div>` : '');
      // spots는 선 위의 점. warn만 빨강, 나머지는 작게
      w.spots.forEach((s, j) => L.marker([s.lat, s.lng], {icon: L.divIcon({className: '', html: `<div style="background:${s.warn ? '#c62828' : '#666'};color:#fff;border-radius:50%;width:${s.warn ? 18 : 14}px;height:${s.warn ? 18 : 14}px;display:flex;align-items:center;justify-content:center;font-size:${s.warn ? 11 : 9}px">${j + 1}</div>`, iconSize: [18, 18]})}).addTo(layer).bindTooltip(`${s.text}${s.note ? ' — ' + s.note : ''}`));
      if (w.polyline) map.fitBounds(L.latLngBounds(decodePolyline(w.polyline)).pad(0.2));
    }
    list.appendChild(card);
  });
}
run({reset: true});
</script>
</body>
</html>
